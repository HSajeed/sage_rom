  - source_file: fixtures/pimpleFoam_v2006/UEqn.H
    line: 9
    namespace: ""
    function: divDevReff
    call_form: member_arrow
    receiver: turbulence
    scope: operator
    term_kind: forwarding
    physics_class: continuum_physics
    physical_type: viscous_stress_divergence
    discretization_role: implicit+explicit
    doc_reference: >-
      Programmer's Guide v2512 §1.2.4 p.18 (pisoFoam.C header lines 46-48:
      ∂U/∂t + ∇·(UU) − ∇·R = −∇p, R the stress tensor) and §1.1.3 p.12
      (−∇·μ∇U ↔ −fvm::laplacian(mu, U)); dispatch itself not covered; source:
      IncompressibleTurbulenceModel.C:117 -> linearViscousStress.C:102-103
    math: >-
      −∇·[ν_eff(∇U + (∇U)^T − (2/3)(∇·U)I)] = ∇·R_dev,
      R_dev = −ν_eff dev(twoSymm(∇U)) (linearViscousStress.C:86-87);
      split as −∇·(ν_eff∇U) [implicit] − ∇·[ν_eff dev2((∇U)^T)] [explicit]
    confidence: medium
    arguments: [U]
    active_in_case: "yes"
    reviewed: true
    note: >
      PROPOSED LABEL. This is the ENTIRE viscous term of the momentum
      equation. It expands, through IncompressibleTurbulenceModel::divDevReff
      -> divDevRhoReff (virtual) -> linearViscousStress::divDevRhoReff, to
        - fvc::div(nuEff*dev2(T(fvc::grad(U)))) - fvm::laplacian(nuEff, U)
      with nuEff = nu for Stokes. The two parts sum to the divergence of the
      deviatoric viscous stress: dev2(A) = A − (2/3)tr(A)I and the laplacian
      supplies the ∇U part with no trace removed. Sign convention: the call
      sits on the LHS with +, so it is MINUS the physical viscous force.
      Owner decision 2026-09-17: stays expanded. This call site is a
      forwarding node (term_kind: forwarding); the real terms are
      linearViscousStress.C:102 fvc::div and :103 fvm::laplacian.

