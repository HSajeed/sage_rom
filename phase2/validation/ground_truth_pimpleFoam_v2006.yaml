# GATE 1 GROUND TRUTH -- STATUS: REVIEWED 2026-09-17 by owner (human review)
#
# Labels proposed 2026-09-17 against the OpenFOAM (ESI/openfoam.com)
# Programmer's Guide v2512 (Openfoam_doc.pdf, 59 pp.; printed page P-n is PDF
# page index n-1). VERSION NOTE: the guide is v2512 but the solver source and
# the dataset are v2006. Version-sensitive items are marked
# "VERSION-SENSITIVE" in the notes (fvc::div of a volField uses a run-time
# divScheme in v2006, not the fixed central differencing the guide describes;
# fvc::interpolate is not the guide's faceInterpolate(); ddtCorr coefficient
# details; the three-argument ddtCorr(U, phi, Uf) overload). Where the guide
# is silent, labels come from the v2006 source and doc_reference says so.
# Rationale per entry, the textbook-NS mapping and the implied ontology
# changes are in validation/labeling_notes_pimpleFoam_v2006.md.
#
# LABELING POLICY (owner decision, 2026-09-17; policy version below)
#   Rule 1 (verbatim): physical_type = operator + operand (what the term IS in
#   context, per guide §3.4.2 vs §3.4.5).
#     fvc::grad(p) -> pressure_gradient; fvc::grad(U) -> velocity_gradient;
#     generic other -> gradient; fvc::div(phiHbyA) (face flux) ->
#     flux_divergence; fvc::div(phi,U)-style two-arg -> convection;
#     fvc::div(nuEff*dev2(T(grad U))) -> viscous_stress_divergence_explicit;
#     fvc::snGrad(p) -> pressure_gradient_face_normal (otherwise
#     surface_normal_gradient). Explicit/implicit lives in
#     discretization_role, never in physical_type.
#     Known exception, kept for consistency with the REVIEWED icoFoam key:
#     fvm::laplacian is labelled `diffusion` for every operand (including
#     laplacian(rAtU(), p)); see the notes file.
#   Rule 2: nuEff, dev2, T -> scope: operator_argument. They stay in the key
#     for Gate 1 call-identity matching but are never ROM terms. Roles stay
#     coefficient / algebraic.
#   Rule 3: divDevReff stays expanded. UEqn.H:9 divDevReff and
#     IncompressibleTurbulenceModel.C:117 divDevRhoReff are
#     term_kind: forwarding; the linearViscousStress.C fvm::laplacian(nuEff, U)
#     and fvc::div(... dev2 ...) are the real terms (term_kind: term).
#     Every operator-scope entry has term_kind term | forwarding;
#     operator_argument entries have term_kind: argument.
#     Confirmed at owner review: an fvc:: call
#     nested inside another operator's argument (fvc::grad(U) in
#     linearViscousStress.C:87/102/118) keeps scope: operator but gets
#     term_kind: argument, matching the graph's nested_in handling.
#   Rule 4: fvOptions(U) -> user_source, role implicit_or_explicit.
#     Decided (owner review): function stays `fvOptions`, receiver: null (a
#     functor call has no receiver, matching what the parser records).
#
# PHYSICS_CLASS VOCABULARY (owner review 2026-09-17). Every operator-scope
# entry with term_kind term or forwarding carries physics_class:
#   continuum_physics    -- a term of the continuous governing equations
#                           (time derivative, convection, viscous stress,
#                           momentum pressure gradient, frame/user sources)
#   pressure_projection  -- part of the discrete pressure-velocity projection
#                           that enforces continuity (HbyA flux, pressure
#                           Laplacian with coefficient rAtU = 1/A [s], div of
#                           the predicted flux, SIMPLEC/corrector pressure
#                           gradients); not a continuum term by itself
#   numerical_correction -- discretisation/interpolation corrections with no
#                           continuum counterpart (ddtCorr, face interpolation
#                           of 1/A coefficients)
# The pressure fvm::laplacian keeps physical_type `diffusion` (Rule 1
# exception) but is physics_class pressure_projection, NOT physical diffusion.
#
# All 51 entries have `reviewed: true`: the owner reviewed every entry on
# 2026-09-17 (the 19 operator terms and 2 forwarding nodes explicitly; the 3
# nested arguments, nuEff/dev2/T and all 24 bookkeeping entries included).
# Runtime switches (pimple.ddtCorr(), pimple.consistent(), ...) are NOT
# evaluated by the parser; dead-branch exclusion lives only in active_in_case.
#
# Source: OpenFOAM.com v2006 pimpleFoam, laminar (Stokes) viscous path.
# This is the solver that produced of_cylinder2D_binary; see
# fixtures/pimpleFoam_v2006/PROVENANCE.txt for the commit, blob ids and the
# verified call chain.
#
# This is a MULTI-FILE fixture, so each entry has its own `source_file`.
# gate1_check scores only the entries whose source_file matches --source,
# and must be run once per file:
#   python -m validation.gate1_check --source fixtures/pimpleFoam_v2006/UEqn.H \
#       --ground-truth validation/ground_truth_pimpleFoam_v2006.yaml --include-unqualified
#   (repeat for pEqn.H, linearViscousStress.C, IncompressibleTurbulenceModel.C)
#
# Scope:
#   * every fvm:: / fvc:: call in UEqn.H, pEqn.H and linearViscousStress.C;
#   * unqualified calls that add a term, operator or constraint to the
#     discretised equations (member calls such as turbulence->divDevReff(U),
#     MRF.DDt(U), UEqn.H(); free functions such as solve, constrainHbyA,
#     dev2, T; the functor fvOptions(U)). These have `namespace: ""`.
#   * Pure control queries (pimple.ddtCorr(), p.needReference(),
#     pimple.nCorrPISO(), mesh.solver(), p.select()) are left out, and so are
#     bookkeeping calls (tUEqn.clear(), tUEqn.ref()) and geometry accessors
#     (mesh.magSf()). The reviewer should decide whether any of them belong.
#   * Stokes.C has no fvm::/fvc:: calls and no divDev* member (see PROVENANCE),
#     so it has no entries. pimpleFoam.C's only fvc:: call is
#     fvc::makeRelative(phi, U) at line 145, inside the moving-mesh branch;
#     it is also left out. The reviewer may add it.
#   * linearViscousStress.C also yields non-DSL qualified calls
#     (BasicTurbulenceModel::read/correct, IOobject::groupName). They are not
#     operators and have no entries, so gate1 reports them as EXTRA.
#
# Extra fields (ignored by gate1_check, kept for the reviewer):
#   scope:      operator    -- a term/operator of the discretised equations:
#                              fvm::/fvc:: differential/interpolation calls,
#                              the divDevReff dispatch and its expansion,
#                              fvOptions(U), MRF.DDt(U)
#               bookkeeping -- matrix accessors/manipulation, solves,
#                              relaxation, boundary/reference constraints,
#                              MRF/mesh-motion flux frame changes
#               (bookkeeping does NOT mean "drop from the graph": A()/H()
#               carry data flow from UEqn to pEqn -- see notes file)
#               operator_argument -- coefficient / pointwise tensor algebra
#                              inside an operator's argument (nuEff, dev2, T):
#                              Gate 1 identity only, never a ROM term
#   physics_class: continuum_physics | pressure_projection |
#               numerical_correction (operator term/forwarding only; see
#               PHYSICS_CLASS VOCABULARY above)
#   upstream_status: known upstream defect/change for this call site
#   term_kind:  term | forwarding (operator scope); argument
#               (operator_argument scope). forwarding = dispatch node whose
#               body is expanded elsewhere; must not be counted as a term.
#               An operator-scope fvc:: call nested inside another operator's
#               argument (fvc::grad(U) inside fvc::div(...) or inside
#               dev(twoSymm(...))) is also term_kind: argument; nesting inside
#               a bookkeeping wrapper (solve, zeroFilter, constrainHbyA) does
#               not demote a term.
#   discretization_role (operator/operator_argument entries): implicit | explicit |
#               implicit+explicit | implicit_or_explicit | algebraic |
#               coefficient
#   doc_reference: Programmer's Guide v2512 section, printed page,
#               equation/table; or "not covered ...; source: <file:line>".
#               Upstream library sources are checked in verbatim under
#               fixtures/pimpleFoam_v2006/upstream/ (tag OpenFOAM-v2006,
#               commit b45f8f6f; blob ids in PROVENANCE.txt).
#   math:       the operator's meaning, in the guide's notation where the
#               guide gives it (ν=nuEff, ρ≡1, kinematic p)
#   confidence: high | medium | low
#   call_form:  qualified | member_dot | member_arrow | this_member |
#               free_function | functor
#   active_in_case: whether the term is non-zero or has an effect in
#               of_cylinder2D_binary (laminar, constant nu, no MRF, no
#               fvOptions, static mesh, consistent yes, ddtCorr default true)
#   in_momentum_path: (linearViscousStress.C only) whether pimpleFoam's
#               momentum equation actually reaches this call
#
# "PROPOSED LABEL" in a note marks a label that was not in the pre-2026-09-17
# ontology when drafted; all such labels were accepted at owner review.

physical_type_policy_version: "2026-09-17"   # see LABELING POLICY above
